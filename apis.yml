description: Azafaros B.V. develops therapeutic candidates for severe rare metabolic disorders. Its lead program is the orally available azasugar
  nizubaglustat, designed to treat central nervous system involvement and modulate glycosphingolipid metabolism in lysosomal storage diseases.
  The company focuses on patients with conditions such as GM1/GM2 gangliosidoses.

